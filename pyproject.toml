[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npcomposer"
version = "1.0.0"
description = "Controllable natural product generation through a fine-tuned transformer decoder model"
authors = [
    {name = "Juyoung Choi", email = "juyoung1@uw.edu"}, 
    {name = "Drew Levitt", email = "levitt@uw.edu"},
    {name = "Shawn Ralyn", email = "ralyn@uw.edu"},
]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "rdkit>=2023.03.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "requests>=2.28.0",
    "transformers==4.44.2",
    "datasets>=2.19.0,<3",
    "accelerate>=0.21.0",
    "torch",
    "pyyaml",
    "wandb"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["external", "outputs", "data", ".git"]

[tool.setuptools.packages.find]
include = ["tests*"]